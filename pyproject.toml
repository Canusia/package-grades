[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myce_grades"
version = "0.0.4"
authors = [
  { name="Avinash Kadaji", email="avi@canusia.com" },
]
description = "MyCE - Grades (grade submission, grading periods, reports, reminders)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Canusia/package-grades"
