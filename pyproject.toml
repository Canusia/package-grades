[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myce_grades"
version = "1.0.1"
authors = [
  { name="Avinash Kadaji", email="avi@canusia.com" },
]
description = "MyCE - Grades (grade submission, grading periods, reports, reminders)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Django>=3.2",
    "django-simple-history>=3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Multi-campus cis. Optional: tenants with an in-repo cis install without it
# and grades falls back (see grades/compat.py).
campus = ["myce_cis>=0.1.7a"]

[project.urls]
"Homepage" = "https://github.com/Canusia/package-grades"
