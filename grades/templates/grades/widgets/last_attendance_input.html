<div class="last-attendance-wrap mt-1" data-last-attendance-letters="{{ widget.letters }}">
  <label class="small text-muted mb-0" for="{{ widget.attrs.id }}">Last date of attendance</label>
  {% include "django/forms/widgets/input.html" %}
  {% if widget.help_text %}<small class="form-text text-muted">{{ widget.help_text }}</small>{% endif %}
</div>
<script>
(function () {
  // Found by the input's id, not the running script element: pages loaded with
  // jQuery .html() (lazy tabs, modals) run this script from <head>.
  var input = document.getElementById('{{ widget.attrs.id|escapejs }}');
  var wrap = input && input.closest('.last-attendance-wrap');
  if (!wrap || wrap.dataset.lastAttendanceBound) { return; }
  wrap.dataset.lastAttendanceBound = '1';
  var letters = (wrap.dataset.lastAttendanceLetters || '').split(',').filter(Boolean);
  // The grade picker in the same table row (grade grid) or, outside a table,
  // the same form (CE registration edit).
  var scope = wrap.closest('tr') || wrap.closest('form') || document;
  var grade = scope.querySelector('select[name$="grade"]');
  function sync() {
    var show = !!grade && letters.indexOf((grade.value || '').trim()) !== -1;
    wrap.style.display = show ? '' : 'none';
    if (!show && input.value) {
      input.value = '';
    }
  }
  if (grade) { grade.addEventListener('change', sync); }
  sync();
})();
</script>
